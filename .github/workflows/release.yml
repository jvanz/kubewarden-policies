# This workflow automates the release process for policy projects based on git
# tags or manual dispatch. It extracts policy metadata from the tag, determines
# the policy language (Rust or Go), and runs language-specific CI jobs. Upon
# successful tests, it builds and publishes the policy artifact to the OCI
# registry and creates a GitHub release. Finally, it updates the policy catalog
# repository with the new release information.
on:
  workflow_dispatch:
  push:
    tags:
      - "*/v*"

name: Release policy

jobs:
  calculate-policy-from-tag:
    runs-on: ubuntu-latest
    outputs:
      policy-name: ${{ steps.calculate-vars.outputs.policy_name }}
      policy-working-dir: ${{ steps.calculate-vars.outputs.policy_working_dir }}
      policy-version: ${{ steps.calculate-vars.outputs.policy_version }}
      policy-id: ${{ steps.calculate-vars.outputs.policy_id }}
      policy-language: ${{ steps.calculate-vars.outputs.policy_language }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - id: calculate-vars
        shell: bash
        run: |
          policy_name=$( echo ${{ github.ref_name }} | sed 's/\(.*\)\/\(.*\)$/\1/' )
          policy_working_dir=policies/"$policy_name"
          policy_ociUrl=$(yq -r '.annotations."io.kubewarden.policy.ociUrl"' $policy_working_dir/metadata.yml)
          policy_id=${policy_ociUrl##*/}
          policy_language=""

          if [ ! -d "$policy_working_dir" ]; then
            echo "$policy_working_dir does not exist, policy not found";
            exit 1;
          fi

          if [ -f "$policy_working_dir/Cargo.toml" ]; then
            policy_language="rust"
          fi
          if [ -f "$policy_working_dir/go.mod" ]; then
            policy_language="go"
          fi
          # check if it can detect policy language
          if [ "$policy_language" == "" ]; then
            echo "cannot detect $policy_name policy language";
            exit 1;
          fi

          echo "policy_name=$policy_name" >> $GITHUB_OUTPUT
          echo "policy_id=$policy_id" >> $GITHUB_OUTPUT
          echo "policy_working_dir=$policy_working_dir" >> $GITHUB_OUTPUT
          echo "policy_version=$( echo ${{ github.ref_name }} | sed 's/\(.*\)\/\(.*\)$/\2/' | cut -c2- )" >> $GITHUB_OUTPUT
          echo "policy_language=$policy_language" >> $GITHUB_OUTPUT

  continuos-integration:
    uses: ./.github/workflows/reusable-ci.yaml
    needs: calculate-policy-from-tag
    if: ${{ needs.calculate-policy-matrix.outputs.policy-working-dirs != '[]' }}
    strategy:
      matrix:
        policy-working-dir: ${{ fromJSON(needs.calculate-policy-matrix.outputs.policy_working_dirs) }}
    with:
      policy-working-dir: ${{ matrix.policy-working-dir }}
