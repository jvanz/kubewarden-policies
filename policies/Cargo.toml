[workspace]
resolver = "3"
members = ["pod-privileged-policy", "user-group-psp-policy"]

[workspace.dependencies]
anyhow = "1.0"
k8s-openapi = { version = "0.26.0", default-features = false, features = [
  "v1_31",
] }
kubewarden-policy-sdk = "0.15.0"
lazy_static = "1.4"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0"
slog = "2.7"
rstest = "0.26.1"
oci-spec = "0.8"
thiserror = "2.0.16"
jsonpath_lib = "0.3.0"
